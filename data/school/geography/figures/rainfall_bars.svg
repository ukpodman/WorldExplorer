<svg xmlns="http://www.w3.org/2000/svg" class="sl-chart" viewBox="0 0 100.0 51.0" role="img" aria-label="Bar chart: mean annual rainfall falls from about 4,200 mm at Bonny to about 400 mm in the far north-east"><rect class="chart-bg" x="0" y="0" width="100.0" height="51.0"/><text class="ch-lbl" x="38.5" y="7.4" text-anchor="end">Bonny (Niger Delta)</text><rect class="bar bar-0" x="40.0" y="4.0" width="43.00" height="5.0" rx="1"/><text class="ch-val" x="84.20" y="7.4">4,200 mm</text><text class="ch-lbl" x="38.5" y="14.9" text-anchor="end">Calabar</text><rect class="bar bar-1" x="40.0" y="11.5" width="31.43" height="5.0" rx="1"/><text class="ch-val" x="72.63" y="14.9">3,070 mm</text><text class="ch-lbl" x="38.5" y="22.4" text-anchor="end">Port Harcourt</text><rect class="bar bar-2" x="40.0" y="19.0" width="24.57" height="5.0" rx="1"/><text class="ch-val" x="65.77" y="22.4">2,400 mm</text><text class="ch-lbl" x="38.5" y="29.9" text-anchor="end">Central lowlands</text><rect class="bar bar-3" x="40.0" y="26.5" width="11.26" height="5.0" rx="1"/><text class="ch-val" x="52.46" y="29.9">1,100 mm</text><text class="ch-lbl" x="38.5" y="37.4" text-anchor="end">Sokoto</text><rect class="bar bar-4" x="40.0" y="34.0" width="6.65" height="5.0" rx="1"/><text class="ch-val" x="47.85" y="37.4">650 mm</text><text class="ch-lbl" x="38.5" y="44.9" text-anchor="end">Far north (Yobe, Borno)</text><rect class="bar bar-5" x="40.0" y="41.5" width="4.10" height="5.0" rx="1"/><text class="ch-val" x="45.30" y="44.9">400 mm</text></svg>